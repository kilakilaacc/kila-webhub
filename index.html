/* ---- 每月固定規則 ---- */
function fxDate(r,y,m){const last=new Date(y,m+1,0);let a;r=(r||"").replace(/[（(].*$/,"").trim().replace(/^月底當天$/,"月底");

 const wk="週"+WD[t0.getDay()],list=D.tasks.filter(t=>(t[0]==="每日"||t[0]===wk)&&mine(t[2])),wl=D.tasks.filter(t=>t[0]==="每週"&&mine(t[2])),wn=wl.filter(t=>D.checks.includes(t[0]+"|"+t[1])).length,ck=t=>D.checks.includes(t[0]+"|"+t[1]);
